name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Import Apple Developer certificate into a temporary Keychain
      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      # Build, sign, archive, publish release, and update Homebrew cask
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      # Notarize macOS archives, then replace them in the release
      - name: Notarize and update macOS binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # App bundle: notarize, then staple the ticket into the .app
          # and re-zip so offline Gatekeeper checks pass.
          for archive in dist/Lazyagent_*_darwin_universal.zip; do
            echo "Notarizing $archive ..."
            xcrun notarytool submit "$archive" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait --timeout 360m

            STAPLE_DIR="$(mktemp -d)"
            ditto -x -k "$archive" "$STAPLE_DIR"
            xcrun stapler staple "$STAPLE_DIR/Lazyagent.app"
            rm -f "$archive"
            ditto -c -k --keepParent "$STAPLE_DIR/Lazyagent.app" "$archive"

            FILENAME="$(basename "$archive")"
            echo "Replacing $FILENAME in release $TAG ..."
            gh release delete-asset "$TAG" "$FILENAME" --repo "$GITHUB_REPOSITORY" --yes
            gh release upload "$TAG" "$archive" --repo "$GITHUB_REPOSITORY"
          done

          # CLI binaries: notarize the zips as before (no bundle to staple).
          for archive in dist/lazyagent-cli_*_darwin_*.zip; do
            echo "Notarizing $archive ..."
            xcrun notarytool submit "$archive" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait --timeout 360m

            FILENAME="$(basename "$archive")"
            echo "Replacing $FILENAME in release $TAG ..."
            gh release delete-asset "$TAG" "$FILENAME" --repo "$GITHUB_REPOSITORY" --yes
            gh release upload "$TAG" "$archive" --repo "$GITHUB_REPOSITORY"
          done

          # Update checksums
          echo "Updating checksums ..."
          CHECKSUMS="dist/lazyagent_${TAG#v}_checksums.txt"
          if [ -f "$CHECKSUMS" ]; then
            cd dist
            shasum -a 256 Lazyagent_*.zip lazyagent-cli_*.zip lazyagent-cli_*.tar.gz > "$(basename "$CHECKSUMS")"
            cd ..
            CHECKSUMS_NAME="$(basename "$CHECKSUMS")"
            gh release delete-asset "$TAG" "$CHECKSUMS_NAME" --repo "$GITHUB_REPOSITORY" --yes
            gh release upload "$TAG" "$CHECKSUMS" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Update cask sha256 after stapling
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NEW_SHA="$(shasum -a 256 dist/Lazyagent_*_darwin_universal.zip | awk '{print $1}')"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/illegalstudio/homebrew-tap.git" tap
          cd tap
          # goreleaser writes the cask with the pre-staple sha256; fix it.
          sed -i '' -E "s/sha256 \"[0-9a-f]{64}\"/sha256 \"${NEW_SHA}\"/" Casks/lazyagent.rb
          # The cask must link the app-internal binary as the `lazyagent`
          # command (configured via homebrew_casks[].binaries) — fail loudly
          # if a goreleaser bump regresses the stanza.
          if ! grep -q 'binary "#{appdir}/Lazyagent.app/Contents/MacOS/lazyagent"' Casks/lazyagent.rb; then
            echo "ERROR: appdir binary stanza missing from the cask — goreleaser template changed?" >&2
            exit 1
          fi
          if ! grep -q "sha256 \"${NEW_SHA}\"" Casks/lazyagent.rb; then
            echo "ERROR: sha256 patch did not land in the cask" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "lazyagent: update cask sha256 after notarization staple (${TAG})"
          git push

      # Clean up keychain
      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

  linux-desktop:
    name: Linux desktop packages
    needs: goreleaser
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            build-essential \
            desktop-file-utils \
            file \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74

      - name: Test
        run: go test ./...

      - name: Build Linux packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm ci --prefix frontend
          make linux-packages \
            VERSION="$VERSION" \
            COMMIT="$(git rev-parse --short HEAD)" \
            GOARCH=amd64

      - name: Validate desktop artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          desktop-file-validate build/linux/lazyagent.desktop
          appstreamcli validate --no-net build/linux/com.illegalstudio.lazyagent.metainfo.xml
          if ldd dist/linux-desktop/lazyagent | grep -q 'not found'; then
            ldd dist/linux-desktop/lazyagent
            exit 1
          fi
          dist/linux-desktop/lazyagent --version
          chmod +x "dist/Lazyagent_${VERSION}_linux_amd64.AppImage"
          "dist/Lazyagent_${VERSION}_linux_amd64.AppImage" \
            --appimage-extract-and-run --version

      - name: Upload Linux packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          ASSETS=(
            "Lazyagent_${VERSION}_linux_amd64.AppImage"
            "Lazyagent_${VERSION}_linux_amd64.deb"
            "Lazyagent_${VERSION}_linux_amd64.rpm"
            "Lazyagent_${VERSION}_linux_amd64.pkg.tar.zst"
          )
          sha256sum "${ASSETS[@]}" > "lazyagent_${VERSION}_linux_checksums.txt"
          gh release upload "$GITHUB_REF_NAME" \
            "${ASSETS[@]}" \
            "lazyagent_${VERSION}_linux_checksums.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber
