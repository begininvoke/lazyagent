version: 2

before:
  hooks:
    - npm install --prefix frontend
    - npm run build --prefix frontend
    # internal/assets/dist/ is tracked (with .gitkeep) so the embed compiles
    # on a bare clone. Plain `cp -r SRC DST` over an existing dir nests as
    # DST/SRC/, so we wipe the target first.
    - rm -rf internal/assets/dist
    - cp -r frontend/dist internal/assets/dist

builds:
  # macOS: full build with GUI support (runs on macos-latest runner)
  - id: darwin
    main: .
    binary: lazyagent
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w
      - -X github.com/illegalstudio/lazyagent/internal/version.Version={{.Version}}
      - -X github.com/illegalstudio/lazyagent/internal/version.Commit={{.ShortCommit}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

  # macOS: CLI/TUI only (no Wails, no CGo) — ships as lazyagent-cli
  - id: darwin-cli
    main: .
    binary: lazyagent-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/illegalstudio/lazyagent/internal/version.Version={{.Version}}
      - -X github.com/illegalstudio/lazyagent/internal/version.Commit={{.ShortCommit}}
    tags:
      - notray
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    hooks:
      post:
        - scripts/codesign.sh {{ .Path }}

  # Linux: TUI only, no GUI (no CGo needed)
  - id: linux
    main: .
    binary: lazyagent-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/illegalstudio/lazyagent/internal/version.Version={{.Version}}
      - -X github.com/illegalstudio/lazyagent/internal/version.Commit={{.ShortCommit}}
    tags:
      - notray
    goos:
      - linux
    goarch:
      - amd64
      - arm64

universal_binaries:
  - id: darwin
    ids:
      - darwin
    name_template: lazyagent
    replace: true
    hooks:
      post:
        - scripts/codesign.sh "{{ .Path }}"
        - scripts/make-app.sh "{{ .Path }}" "{{ .Version }}" dist

archives:
  # The desktop app: a zip containing Lazyagent.app.
  #
  # NOTE: not `meta: true`. In OSS goreleaser (v2.14.2), archive.go's
  # createMeta() always calls create() with binaries=nil, so a meta
  # archive can never carry Goos/Goarch — but the homebrew_casks pipe
  # (cask.go doRun) hard-requires ByGooses/ByGoarches on the matched
  # archive, so a meta archive is invisible to it ("no linux/macos
  # archives found matching goos=... ids=[darwin-app]"). Referencing the
  # `darwin` universal_binaries id here makes this a normal archive that
  # inherits Goos=darwin/Goarch=all from the embedded universal binary
  # (so the cask can find it), while `files` still adds Lazyagent.app.
  - id: darwin-app
    ids:
      - darwin
    name_template: "Lazyagent_{{ .Version }}_darwin_universal"
    formats:
      - zip
    files:
      - src: dist/Lazyagent.app
        dst: Lazyagent.app
  - id: darwin-cli
    ids:
      - darwin-cli
    name_template: "lazyagent-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip
    files:
      - README.md
      - LICENSE
  - id: linux
    ids:
      - linux
    name_template: "lazyagent-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: lazyagent
    ids:
      - darwin-app
    # `app` (Pro-only, DMG-based) isn't available in OSS goreleaser; the
    # zip already contains Lazyagent.app, so inject the standard Homebrew
    # Cask `app` stanza directly.
    custom_block: |
      app "Lazyagent.app"
    # DEVIATION (documented in task-5-report.md, fix round 1): goreleaser
    # OSS unconditionally emits a top-level `binary "lazyagent"` stanza
    # here — internal/pipe/cask/cask.go's Default() forces
    # homebrew_casks[].binaries to [name] whenever it's empty or its
    # first entry is "" (confirmed identical in installed v2.14.2 and
    # latest goreleaser main; `binaries: []` was tested and has no
    # effect — Default() re-populates it). There is no config-only way
    # to suppress it, and the `lazyagent` command is retired (CLI ships
    # only as `lazyagent-cli`, via the app's ~/bin self-link and the
    # separate `brews` formula below) — linking it into PATH would also
    # collide with the `lazyagent-cli` formula on co-install. The release
    # CI workflow must strip this `binary "lazyagent"` line from the
    # generated tap cask after goreleaser writes it (before/instead of
    # publishing), same place notarization already patches the cask.
    repository:
      owner: illegalstudio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/illegalstudio/lazyagent
    description: Desktop app for monitoring coding agent sessions (includes the CLI)

brews:
  - name: lazyagent-cli
    ids:
      - darwin-cli
      - linux
    repository:
      owner: illegalstudio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/illegalstudio/lazyagent
    description: A lazy TUI for monitoring coding agent sessions
